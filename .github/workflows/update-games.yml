name: Update browser games

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rescan sources
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./rescan-browser-games.ps1
      - name: Commit updates
        shell: powershell
        run: |
          git config user.name "games-bot"
          git config user.email "games-bot@users.noreply.github.com"
          git add index.html browser-games.auto.html browser-games-sources.json
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "auto: rescan games"; git push }
